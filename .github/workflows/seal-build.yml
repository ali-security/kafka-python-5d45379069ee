name: seal-build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Pin release-era build tooling
        run: |
          python -m pip install --upgrade "pip<21"
          python -m pip install "setuptools==41.2.0" "wheel==0.33.6"

      - name: Build sdist and wheel
        run: python setup.py sdist bdist_wheel

      - name: List artifacts
        run: ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install snappy headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsnappy-dev

      - name: Install test dependencies
        run: |
          python -m pip install "pytest==3.10.0" "pytest-mock==1.10.0" "mock==3.0.5" six "lz4==4.3.2" "python-snappy==0.6.1" "xxhash==3.2.0" "crc32c==2.3"
          python -m pip install .

      - name: Run test suite
        env:
          CRC32C_SW_MODE: auto
          PROJECT_ROOT: ${{ github.workspace }}
        run: python -m pytest test/ -v
