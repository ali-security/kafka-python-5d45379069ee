name: seal-build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Pin release-era build tooling
        run: |
          python -m pip install --upgrade "pip<21"
          python -m pip install "setuptools==41.2.0" "wheel==0.33.6"

      - name: Build sdist and wheel
        run: python setup.py sdist bdist_wheel

      - name: List artifacts
        run: ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

    timeout-minutes: 40

  test-py37:
    name: Unit tests (Python 3.7)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Install snappy headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsnappy-dev

      - name: Install test dependencies
        run: |
          python -m pip install "pytest==3.10.0" "pytest-mock==1.10.0" "mock==3.0.5" six "lz4==4.3.2" "python-snappy==0.6.1" "xxhash==3.2.0" "crc32c==2.3"
          python -m pip install .

      - name: Run test suite
        env:
          CRC32C_SW_MODE: auto
          PROJECT_ROOT: ${{ github.workspace }}
        run: python -m pytest test/ -v

    timeout-minutes: 40

  test-py27:
    name: Unit tests (Python 2.7)
    runs-on: ubuntu-22.04
    container:
      image: python:2.7-slim
    steps:
      - uses: actions/checkout@v4

      - name: Switch to Debian archive mirrors
        run: |
          sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list

      - name: Install system dependencies
        run: |
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y gcc g++ libsnappy-dev

      - name: Install test dependencies
        run: |
          pip install "pytest==3.10.1" "pytest-mock==1.10.0" "mock==3.0.5" six "lz4==2.2.1" "python-snappy==0.5.4" "xxhash==1.4.4" "crc32c==1.7"
          pip install .

      - name: Run test suite
        env:
          CRC32C_SW_MODE: auto
          PROJECT_ROOT: /github/workspace
        run: python -m pytest test/ -v

    timeout-minutes: 40
